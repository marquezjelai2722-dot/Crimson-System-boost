name: Build Crimson System Boost (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package .exe files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target\release\*.exe" -Destination "dist\"
          Compress-Archive -Path "dist\*" -DestinationPath "Crimson-System-boost-windows-x64.zip" -Force

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist\*.exe
            Crimson-System-boost-windows-x64.zip

      - name: Upload build artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: Crimson-System-boost-windows-x64
          path: dist\*.exe
