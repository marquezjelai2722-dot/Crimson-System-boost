name: Build and syntax validation

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/security-cross-platform-fps"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Build installable APK
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Crimson-System-Boost-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check backend syntax
        run: node --check backend/server.js

  windows-exe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $files = @("windows/Crimson-Windows.ps1", "windows/Crimson-Windows-GUI.ps1", "windows/modules/Crimson.Inventory.psm1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$($file): $($_.Message)" }; exit 1 }
            Write-Host "$file syntax is valid."
          }
      - name: Install PS2EXE
        shell: pwsh
        run: Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
      - name: Package Windows GUI executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Invoke-PS2EXE -inputFile "windows/Crimson-Windows-GUI.ps1" -outputFile "dist/Crimson-System-Boost-Windows.exe" -noConsole -STA -title "Crimson System Boost" -description "Crimson System Boost Windows desktop utility" -company "Crimson System Boost"
          if (-not (Test-Path "dist/Crimson-System-Boost-Windows.exe")) { throw "EXE packaging did not produce an output file." }
          $exe = Get-Item "dist/Crimson-System-Boost-Windows.exe"
          if ($exe.Length -le 0) { throw "EXE output is empty." }
          $stream = [System.IO.File]::OpenRead($exe.FullName)
          try { $mz = New-Object byte[] 2; [void]$stream.Read($mz, 0, 2) } finally { $stream.Dispose() }
          if ([System.Text.Encoding]::ASCII.GetString($mz) -ne "MZ") { throw "EXE does not have a valid Windows PE signature." }
          Write-Host ("Packaged EXE: {0:N0} bytes" -f $exe.Length)
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: Crimson-System-Boost-Windows-EXE
          path: dist/Crimson-System-Boost-Windows.exe
          if-no-files-found: error
          retention-days: 30
