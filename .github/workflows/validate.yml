name: Build and syntax validation

on:
  pull_request:
    branches: ["main", "feature/security-cross-platform-fps"]
  push:
    branches: ["feature/security-cross-platform-fps", "rebuild/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Crimson-System-Boost-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check backend syntax
        run: node --check backend/server.js

  windows-exe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $files = @("windows/Crimson-Windows.ps1", "windows/Crimson-Windows-GUI.ps1", "windows/Build-Windows.ps1", "windows/modules/Crimson.Inventory.psm1", "windows/modules/Crimson.Security.psm1", "windows/modules/Crimson.Maintenance.psm1", "windows/modules/Crimson.Performance.psm1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$($file): $($_.Message)" }; exit 1 }
            Write-Host "$file syntax is valid."
          }
      - name: Install PS2EXE
        shell: pwsh
        run: Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
      - name: Package Windows GUI executable
        shell: pwsh
        run: |
          & "windows/Build-Windows.ps1"
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: Crimson-System-Boost-Windows-EXE
          path: dist/Crimson-System-Boost-Windows.exe
          if-no-files-found: error
          retention-days: 30
