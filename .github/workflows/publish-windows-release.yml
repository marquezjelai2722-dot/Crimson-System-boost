name: Publish Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Build optimized Windows executable
        run: cargo build --release --bin crimson-system-boost

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Crimson System Boost ${{ github.ref_name }} — Windows
          body: |
            Windows x64 build of Crimson System Boost.

            This is an early monitoring and security-integration scaffold. It does not modify Windows Firewall rules or apply system optimizations.
          files: target/release/crimson-system-boost.exe
          draft: false
          prerelease: true
          make_latest: false
