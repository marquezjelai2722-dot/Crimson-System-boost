name: Build and publish Windows installer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-windows-release.yml"
      - "installer/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create/publish (for example v1.1.0)"
        required: true
        default: "v1.1.0"
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Determine release version
        id: release_meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}".Trim()
          } elseif ("${{ github.ref_type }}" -eq "branch" -and "${{ github.ref_name }}" -eq "main") {
            $tag = "v1.1.0"
          } else {
            $tag = "${{ github.ref_name }}".Trim()
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $tag"
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Build optimized Windows x64 executable
        run: cargo build --release --bin crimson-system-boost

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc "/DMyAppVersion=${{ steps.release_meta.outputs.version }}" "installer\CrimsonSystemBoost.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setup = "installer\Output\Crimson-System-Boost-Setup-v${{ steps.release_meta.outputs.version }}.exe"
          if (-not (Test-Path $setup)) {
            throw "Installer output is missing: $setup"
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: main
          name: Crimson System Boost ${{ steps.release_meta.outputs.tag }} — Windows
          body: |
            Crimson System Boost ${{ steps.release_meta.outputs.tag }} — Windows x64 prerelease.

            ## Included
            - OneClick and Platinum+ optimization profiles.
            - Seven allow-listed per-user Windows registry tweaks with saved original values and an undo path.
            - CPU and RAM monitoring with a bottom status bar.
            - Read-only startup, process, service, installed-app, graphics-driver, and power-plan inventories.
            - Temporary-folder cleanup preview and bounded DNS/ping diagnostics.
            - Runtime executable integrity checking and optional Microsoft Defender scanning.

            ## Important limitations
            - No guaranteed FPS increase is claimed.
            - The status bar does not yet report game FPS or GPU telemetry.
            - Cleanup, startup changes, service control, app removal, and process controls are not implemented.
            - Graphics scaling, frame generation, game recording, and desktop customization are not implemented.
            - Optimization changes are limited to the documented allow-listed per-user registry settings. Defender, Firewall, Windows Update, drivers, and essential services are not disabled.

            ## Installer
            Per-user installation under LocalAppData with Start Menu shortcuts and an uninstaller. Runtime installation and uninstall still need testing on physical Windows systems.
          files: |
            installer/Output/Crimson-System-Boost-Setup-v${{ steps.release_meta.outputs.version }}.exe
            target/release/crimson-system-boost.exe
          draft: false
          prerelease: true
          make_latest: false
