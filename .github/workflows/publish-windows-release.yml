name: Build and publish Windows installer

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/publish-windows-release.yml"
      - "installer/**"
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "installer/**"
      - ".github/workflows/publish-windows-release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create/publish (for example v1.2.0)"
        required: true
        default: "v1.3.0"
        type: string

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      version: ${{ steps.release_meta.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Determine release version
        id: release_meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $tag = "v1.2.0-pr-validation"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}".Trim()
          } else {
            $versionLine = Select-String -Path "Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
            if (-not $versionLine) { throw "Could not read package version from Cargo.toml" }
            $version = $versionLine.Matches.Groups[1].Value
            $tag = "v$version"
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $tag"
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Build optimized Windows x64 executable
        run: cargo build --release --bin crimson-system-boost

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc "/DMyAppVersion=${{ steps.release_meta.outputs.version }}" "installer\CrimsonSystemBoost.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setup = "installer\Output\Crimson-System-Boost-Setup-v${{ steps.release_meta.outputs.version }}.exe"
          if (-not (Test-Path $setup)) {
            throw "Installer output is missing: $setup"
          }

      - name: Smoke-test installer and uninstaller
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer/Output/Crimson-System-Boost-Setup-v${{ steps.release_meta.outputs.version }}.exe").Path
          $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent installer failed with exit code $($install.ExitCode)"
          }
          $installedExe = Join-Path $env:LOCALAPPDATA "Programs/Crimson System Boost/crimson-system-boost.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installed executable was not found at $installedExe"
          }
          $uninstaller = Join-Path (Split-Path $installedExe) "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller was not created."
          }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($remove.ExitCode -ne 0) {
            throw "Silent uninstaller failed with exit code $($remove.ExitCode)"
          }
          if (Test-Path $installedExe) {
            throw "Installed executable remains after uninstall."
          }

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $files = @(
            "installer/Output/Crimson-System-Boost-Setup-v${{ steps.release_meta.outputs.version }}.exe",
            "target/release/crimson-system-boost.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -LiteralPath "SHA256SUMS.txt" -Encoding ascii

      - name: Upload release assets for publishing
        uses: actions/upload-artifact@v4
        with:
          name: crimson-windows-release-assets
          if-no-files-found: error
          path: |
            installer/Output/Crimson-System-Boost-Setup-v${{ steps.release_meta.outputs.version }}.exe
            target/release/crimson-system-boost.exe
            SHA256SUMS.txt

  publish-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-and-package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: crimson-windows-release-assets
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-package.outputs.tag }}
          target_commitish: main
          name: Crimson System Boost ${{ needs.build-and-package.outputs.tag }} — Windows
          body: |
            Crimson System Boost ${{ needs.build-and-package.outputs.tag }} — Windows x64 prerelease.

            ## Included
            - Individually selectable Windows tweaks organized into Gaming, Performance, and Privacy categories.
            - Each tweak appears once; users select the exact settings to apply rather than choosing a bulk optimizer preset.
            - Reversible per-user registry changes with saved original values, verification, rollback on failure, and an undo path.
            - CPU and RAM monitoring with one bottom status bar.
            - Read-only startup, process, service, installed-app, graphics-driver, and power-plan inventories.
            - Seven-day-old direct-child TEMP scan with per-file review, explicit deletion confirmation, and path/age revalidation.
            - Bounded DNS/ping diagnostics, Windows component health scans, and explicitly confirmed DISM/SFC repair.
            - Driver inventory and a user-controlled Windows Update handoff.
            - On-demand updater that verifies the downloaded installer against the release SHA-256 manifest before asking for install approval.
            - Runtime executable integrity checking and optional Microsoft Defender scanning.

            ## Important limitations
            - No guaranteed FPS increase is claimed.
            - Game FPS capture and GPU telemetry are not available in this build.
            - Driver availability is determined by Windows Update or the device maker; Crimson does not scrape or force-install third-party driver packages.
            - Startup changes, service control, app removal, process controls, recording, and desktop customization are not implemented.
            - Graphics scaling and frame generation are not implemented.
            - Optimization changes are limited to the documented allow-listed per-user registry settings. Defender, Firewall, Windows Update, drivers, and essential services are not disabled.

            ## Installer
            Per-user installation under LocalAppData with Start Menu shortcuts and an uninstaller. Runtime installation and uninstall still need testing on physical Windows systems.
          files: |
            release-assets/installer/Output/Crimson-System-Boost-Setup-v${{ needs.build-and-package.outputs.version }}.exe
            release-assets/target/release/crimson-system-boost.exe
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: true
          make_latest: false
