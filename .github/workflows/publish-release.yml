name: Publish separate Crimson platform releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: Build and publish Android APK release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Build installable APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/Crimson-System-Boost-Android-v0.4.1.apk
      - name: Publish Android-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.4.1-android" release-assets/Crimson-System-Boost-Android-v0.4.1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Crimson System Boost v0.4.1 — Android APK" \
            --prerelease \
            --notes "Standalone Android APK release. Debug-signed preview for direct sideload testing; not Play Store production-signed. Review app permissions and compatibility before installing."

  windows-release:
    name: Build and publish Windows EXE release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Install PS2EXE
        shell: pwsh
        run: Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
      - name: Build Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Invoke-PS2EXE -inputFile "windows/Crimson-Windows-GUI.ps1" -outputFile "dist/Crimson-System-Boost-Windows-v0.4.1.exe" -noConsole -STA -title "Crimson System Boost" -description "Crimson System Boost Windows desktop utility" -company "Crimson System Boost"
          $exe = Get-Item "dist/Crimson-System-Boost-Windows-v0.4.1.exe"
          if ($exe.Length -le 0) { throw "EXE output is empty." }
          $stream = [System.IO.File]::OpenRead($exe.FullName)
          try { $mz = New-Object byte[] 2; [void]$stream.Read($mz, 0, 2) } finally { $stream.Dispose() }
          if ([System.Text.Encoding]::ASCII.GetString($mz) -ne "MZ") { throw "EXE does not have a valid Windows PE signature." }
      - name: Publish Windows-only release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "v0.4.1-windows" "dist/Crimson-System-Boost-Windows-v0.4.1.exe" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Crimson System Boost v0.4.1 — Windows EXE" --prerelease --notes "Standalone Windows desktop EXE release. Unsigned portable executable; Windows SmartScreen may show a warning. No installer is included.";
