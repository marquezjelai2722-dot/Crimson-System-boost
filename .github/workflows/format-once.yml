name: One-time Rust formatting

on:
  push:
    paths:
      - ".github/workflows/format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/tamper-lock-screen
      - uses: dtolnay/rust-toolchain@stable
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Apply rustfmt to tamper protection changes"
            git push origin HEAD:security/tamper-lock-screen
          fi
