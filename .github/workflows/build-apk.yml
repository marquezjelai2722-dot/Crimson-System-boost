name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Name release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Crimson-System-Boost-v0.3.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crimson-system-boost-v0.3.0
          path: Crimson-System-Boost-v0.3.0.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish versioned APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: main
          name: Crimson System Boost v0.3.0
          body: |
            ## Crimson System Boost v0.3.0

            Professional dark UI refresh and optional Shizuku-powered advanced controls.

            ### Included
            - Live device and battery monitoring.
            - Local app/game launcher.
            - Shizuku UserService integration with explicit permission request.
            - Android GameManager performance/standard mode requests for a selected app.
            - Package Manager reclaimable cache trim.
            - ART speed-profile compilation request for one selected app.
            - Original Crimson vector logo and updated dashboard.

            ### Safety and compatibility
            Advanced actions require Shizuku and are manually confirmed. The app exposes only fixed allow-listed operations; it does not accept arbitrary shell commands. Android/OEM support varies, and no FPS or performance increase is guaranteed. Cache trimming and app compilation may consume resources or require apps to rebuild cached data.

            This is a debug-signed preview APK for direct testing, not a Play Store production-signed build.
          files: Crimson-System-Boost-v0.3.0.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
