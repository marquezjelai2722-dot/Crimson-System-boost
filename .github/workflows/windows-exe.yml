name: Windows EXE

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build optimized Windows executable
        run: cargo build --release --bin crimson-system-boost

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Crimson-System-Boost-Windows-x64
          path: target/release/crimson-system-boost.exe
          if-no-files-found: error
          retention-days: 30
